# SSG v2: demo_clean_bg16_ssg + visible-surface points from the rendered head-camera depth
# (scene_graph_logger head_vis_centroid / head_vis_points); data in ./data_ssg2.
# Shared-scene-graph (SSG) robot data: demo_clean_bg16 + per-frame scene-graph GT
# (data_type.scene_graph; envs/utils/scene_graph_logger.py) and both wrist cameras.
# Same as demo_clean.yml, but pins the wall + table background texture to
# assets/background_texture/seen/16.png for every episode (see
# fixed_background_texture in envs/_base_task.py -- bypasses random_background,
# the eval-mode seen/unseen split, and clean_background_rate entirely).
#
# if you want to modify the config, please check the following tutorial first:
# https://robotwin-platform.github.io/doc/usage/configurations.html
render_freq: 0
episode_num: 50
use_seed: false
save_freq: 15
embodiment: [aloha-agilex]
language_num: 1
domain_randomization:
  random_background: false
  cluttered_table: false
  clean_background_rate: 1
  random_head_camera_dis: 0
  random_table_height: 0
  random_light: false
  crazy_random_light_rate: 0
  fixed_background_texture: seen/16
camera:
  head_camera_type: Large_D435
  wrist_camera_type: Large_D435
  collect_head_camera: true
  collect_wrist_camera: true
data_type:
  rgb: true
  third_view: false
  depth: false
  scene_graph: true
  pointcloud: false
  observer: false
  endpose: true
  qpos: true
  mesh_segmentation: false
  actor_segmentation: false
pcd_down_sample_num: 1024
pcd_crop: true
save_path: ./data_ssg2
clear_cache_freq: 5
collect_data: true
eval_video_log: true
